<h1>Counter:{{ counter }}</h1>

<h1>Counter Signal:{{ counterSignal() }}</h1>

<button (click)="increaseBy(10)">+10</button>
<button (click)="increaseBy(-10)">-10</button>
<button (click)="resetCounter()">Atualizar</button>

<p>Preço: {{ preco() }}</p>
<p>Quantidade: {{ quantidade() }}</p>
<p>Total: {{ total() }}</p>

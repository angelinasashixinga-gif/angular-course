<p>DragonBallPage</p>
<hr />

<section class="row">
    <div class="col-12 col-sm-6">
        <h2>Registrar: {{ name() }}</h2>

        <input type="text"
         class="form-control" 
        placeholder="Nome Completo"
         [value]="name()"
        (change)="name.set(txtName.value)"
        (input)="name.set(txtName.value)"
         #txtName />

        <h3>{{ power() }}</h3>  

        <input
         type="number" 
        class="form-control mt-2" 
        placeholder="Poder"
        [value]="power()" 
        (input)="power.set(+txtPower.value)"
        #txtPower />

    </div>
    <div class="col-12 col-sm-6">
        <dragonball-character-list [characters]="characters()" />
